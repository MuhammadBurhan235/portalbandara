name: Build and Deploy Portal Bandara

on:
  push:
    branches:
      - main # Menjalankan otomatis setiap kali push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v3

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20 # Menggunakan versi Node terbaru

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Project
        run: npm run build

      - name: 🚀 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # PENTING: Jika akun FTP Anda sudah dikunci ke folder /public_html/portalbandara, gunakan './'
          # Jika menggunakan akun FTP utama, gunakan './public_html/portalbandara/'
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
